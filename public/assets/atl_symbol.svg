<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Left leg gradient: Purple to Electric Blue -->
    <linearGradient id="atlLeftLeg" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Right leg gradient: Electric Blue to Cyan -->
    <linearGradient id="atlRightLeg" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Crossbar gradient -->
    <linearGradient id="atlCrossbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Inner fold shadow -->
    <linearGradient id="atlShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>

    <filter id="atlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left slanted leg with rounded base -->
  <path 
    d="M 16 84 C 13 84 11 81 13 77 L 44 14 C 46 10 52 10 54 14 L 66 38 L 50 64 L 32 64 L 23 82 C 21 84 18 84 16 84 Z" 
    fill="url(#atlLeftLeg)"
  />

  <!-- Right leg folding down -->
  <path 
    d="M 50 14 C 52 10 56 10 58 14 L 88 77 C 90 81 87 84 84 84 C 82 84 79 84 77 82 L 67 62 L 50 62 L 60 42 L 52 24 Z" 
    fill="url(#atlRightLeg)"
  />

  <!-- Crossbar with dimensional depth -->
  <path 
    d="M 33 62 L 72 62 C 75 62 76 64 75 67 L 70 76 C 69 78 67 79 65 79 L 26 79 C 23 79 22 77 23 74 L 27 65 C 28 63 30 62 33 62 Z" 
    fill="url(#atlCrossbar)"
  />

  <!-- Subtle overlay fold shadow for depth -->
  <path 
    d="M 50 14 L 63 40 L 52 62 L 44 46 Z" 
    fill="url(#atlShadow)"
  />
</svg>
