<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Cyan Neon to Electric Blue Glow matching official 3D emblem -->
    <linearGradient id="atlCyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <linearGradient id="atlMetallicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="atlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark tech pill background -->
  <rect width="100" height="100" rx="22" fill="#0B132B" />
  
  <!-- Circuit trace lines in background -->
  <path d="M 15 50 L 30 50 L 40 38 L 60 38" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round" />
  <path d="M 85 50 L 70 50 L 60 62 L 40 62" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round" />

  <!-- Metallic 3D Chevron Arrow Ascending -->
  <path 
    d="M 50 18 L 80 50 L 70 58 L 50 36 L 30 58 L 20 50 Z" 
    fill="url(#atlMetallicGradient)" 
  />

  <!-- Neon Cyan Core Chevron -->
  <path 
    d="M 50 34 L 74 60 L 66 67 L 50 49 L 34 67 L 26 60 Z" 
    fill="url(#atlCyanGradient)" 
    filter="url(#atlGlow)"
  />

  <!-- Lower Tech Innovation Circuit Base -->
  <path 
    d="M 50 54 L 66 72 L 58 78 L 50 68 L 42 78 L 34 72 Z" 
    fill="#00F0FF" 
    opacity="0.9"
  />

  <!-- Center node point -->
  <circle cx="50" cy="50" r="3.5" fill="#FFFFFF" filter="url(#atlGlow)" />
</svg>
